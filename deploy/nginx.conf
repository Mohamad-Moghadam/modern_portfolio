upstream frontend_up { server frontend:3000; }
upstream backend_up  { server backend:8000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    # Admin panel
    location /admin {
        proxy_pass http://backend_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API calls
    location /api/ {
        proxy_pass http://backend_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin CSS/JS (whitenoise serves these inside Django)
    location /static/ {
        proxy_pass http://backend_up;
        proxy_set_header Host $host;
    }

    # Uploaded images (served straight from the shared folder — fast!)
    location /media/ {
        alias /app/data/media/;
    }

    # Everything else = the website
    location / {
        proxy_pass http://frontend_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}